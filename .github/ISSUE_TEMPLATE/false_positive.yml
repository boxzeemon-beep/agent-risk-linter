name: False positive
description: Report a rule that flags safe behavior.
title: "[False positive]: "
labels: [false-positive]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: AGENT001
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Minimal inert sample
      description: Remove private data, credentials, and working malicious endpoints.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Why the behavior is safe in context
    validations:
      required: true
  - type: textarea
    id: narrowing
    attributes:
      label: Suggested rule narrowing
